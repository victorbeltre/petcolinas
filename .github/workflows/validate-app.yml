name: Validar app PetColinas

# Guardia anti-regresión: impide mergear/desplegar una versión de index.html
# que no sea la app completa. Bloquea el merge si faltan pestañas, componentes,
# si la sintaxis JS es inválida o si el archivo es sospechosamente pequeño.
# Motivo: un "deploy" desde petcolinas-app pisó la versión buena con una vieja
# de 10 pestañas (ver PR #33). Esto evita que vuelva a pasar.

on:
  pull_request:
    branches: [main]
    # Tambien cuando cambian las propias comprobaciones o el sello de version:
    # si solo se vigila index.html, se puede romper render-check.js y pasar
    # limpio, y entonces la guardia deja de guardar sin que nadie se entere.
    paths: ['index.html', 'version.txt', '.github/scripts/**', '.github/workflows/validate-app.yml']
  push:
    branches: [main]
    # Tambien cuando cambian las propias comprobaciones o el sello de version:
    # si solo se vigila index.html, se puede romper render-check.js y pasar
    # limpio, y entonces la guardia deja de guardar sin que nadie se entere.
    paths: ['index.html', 'version.txt', '.github/scripts/**', '.github/workflows/validate-app.yml']

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar index.html
        run: node .github/scripts/validate-index.js

      - name: Renderizar las vistas principales
        run: node .github/scripts/render-check.js
